name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Clean Workspace & Build Web
        run: |
          mkdir -p /tmp/app_build
          if [ -d "Admin Dashboard" ]; then
            cp -r "Admin Dashboard"/. /tmp/app_build/
          else
            cp -r . /tmp/app_build/
          fi
          cd /tmp/app_build
          if [ ! -f "package.json" ] && [ ! -f "index.html" ]; then
            FOUND=$(find . -maxdepth 3 \( -name "package.json" -o -name "index.html" \) -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$FOUND" ]; then
              cd "$(dirname "$FOUND")"
            fi
          fi
          WORK_DIR=$(pwd)
          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV

          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build || npx vite build || true
            if [ -d "dist" ]; then
              echo "WEB_DIR=dist" >> $GITHUB_ENV
            elif [ -d "build" ]; then
              echo "WEB_DIR=build" >> $GITHUB_ENV
            else
              mkdir -p www
              find . -maxdepth 1 -not -name '.' -not -name 'www' -not -name 'node_modules' -not -name '.git' -not -name '.github' -exec cp -r {} www/ \;
              echo "WEB_DIR=www" >> $GITHUB_ENV
            fi
          else
            npm init -y
            mkdir -p www
            find . -maxdepth 1 -not -name '.' -not -name 'www' -not -name '.git' -not -name '.github' -not -name 'package.json' -exec cp -r {} www/ \;
            echo "WEB_DIR=www" >> $GITHUB_ENV
          fi

      - name: Setup Capacitor iOS
        run: |
          cd "$WORK_DIR"
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/ios
          rm -f capacitor.config.json capacitor.config.ts
          npx cap init "Benzto2 Admin" "com.benzto2.admin" --web-dir="$WEB_DIR"
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned Archive
        run: |
          cd "$WORK_DIR"
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$WORK_DIR/build/App.xcarchive" archive DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$WORK_DIR/build/App.xcarchive" archive DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package IPA
        run: |
          cd "$WORK_DIR"
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r "$GITHUB_WORKSPACE/Benzto2-Admin.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Benzto2-Admin-IPA
          path: Benzto2-Admin.ipa
